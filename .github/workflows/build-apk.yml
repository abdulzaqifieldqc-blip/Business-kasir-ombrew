
name: Build OMBREW HP dan Tablet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Projects
        run: |
          mkdir -p project/hp project/tablet
          unzip -q OMBREW-APK-Project.zip -d project/hp
          unzip -q OMBREW-Tablet-APK-Project.zip -d project/tablet

      - name: Build APK HP
        run: |
          cd project/hp/ombrew
          bash build-apk.sh

      - name: Build APK Tablet
        run: |
          cd project/tablet/ombrew-tablet-pkg
          bash build-apk.sh

      - name: Upload APK HP
        uses: actions/upload-artifact@v4
        with:
          name: OMBREW-HP
          path: project/hp/ombrew/OMBREW.apk

      - name: Upload APK Tablet
        uses: actions/upload-artifact@v4
        with:
          name: OMBREW-TABLET
          path: project/tablet/ombrew-tablet-pkg/OMBREW-Tablet.apk
