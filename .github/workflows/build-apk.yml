
name: Build APK OMBREW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract OMBREW ZIP
        run: |
          unzip -q OMBREW-APK-Project.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Build OMBREW APK
        run: |
          cd project/ombrew
          bash build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMBREW-apk
          path: project/ombrew/OMBREW.apk
